services:
  mirror:
    build: .
    image: artifact-mirror:1.0.0
    container_name: artifact-mirror
    ports:
      - "8000:8000"
    environment:
      MIRROR_DB_PATH: /data/mirror.db
    volumes:
      - mirror-data:/data
    restart: unless-stopped
    stop_grace_period: 10s

volumes:
  mirror-data:
